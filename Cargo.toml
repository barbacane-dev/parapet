[workspace]
members = ["crates/parapet", "crates/parapet-conformance"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/barbacane-dev/parapet"
authors = ["Parapet contributors"]

[workspace.dependencies]
libinjectionrs = { git = "https://github.com/barbacane-dev/libinjectionrs", rev = "7f35f8097e9dd06005334a0c8f50661ce544a8df" }
quick-xml = "0.42"
regex = "1.12"
regex-syntax = "0.8"
aho-corasick = "1.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "allow"
panic = "warn"
