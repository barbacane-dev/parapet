[package]
name = "barbacane-waf"
version = "0.1.0"
description = "A SecLang rule engine in pure Rust, compatible with the OWASP Core Rule Set"
keywords = ["waf", "seclang", "modsecurity", "security", "firewall"]
categories = ["network-programming", "web-programming"]
readme = "../../README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The published package is barbacane-waf; the library target keeps the name
# parapet, so code using `parapet::` is unchanged.
[lib]
name = "parapet"

[dependencies]
aho-corasick.workspace = true
libinjectionrs.workspace = true
quick-xml.workspace = true
regex.workspace = true
serde = { workspace = true, optional = true }
serde_json.workspace = true
sha1.workspace = true
thiserror.workspace = true

[features]
default = []
# Serialise a parsed rule set, so a host can validate at build time and seal
# the result into its own artifact rather than re-parsing at startup.
serde = ["dep:serde"]

[lints]
workspace = true
