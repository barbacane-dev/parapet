[package]
name = "parapet-conformance"
version = "0.0.0"
description = "Conformance harness measuring Parapet against the OWASP Core Rule Set"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
parapet = { path = "../parapet", package = "barbacane-waf", features = ["serde"] }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

# Standalone per-request cost benchmark. Run against a CRS rules directory that
# includes crs-setup: see the file header. An example rather than a bin so the
# package keeps a single default binary and `cargo run -p parapet-conformance`
# stays unambiguous.
[[example]]
name = "bench_inspect"
path = "tools/bench_inspect.rs"
