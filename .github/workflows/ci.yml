name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CRS_VERSION: 4.9.0
  # Ratchet only. Raise it when the pass rate improves; never lower it.
  FTW_BASELINE: "94.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The serde feature is how a host seals a validated rule set into its
      # own artifact, so it is part of the public surface and gets checked.
      - run: cargo clippy -p parapet --features serde --all-targets -- -D warnings
      - run: cargo test -p parapet --features serde

  # Line coverage of the library, source-based instrumentation via
  # cargo-llvm-cov. COVERAGE_FLOOR is enforced: raise it when the real number
  # rises, never lower it to turn a red build green.
  coverage:
    runs-on: ubuntu-latest
    env:
      COVERAGE_FLOOR: "88"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage
        # Run the instrumented tests once, then format the same data three ways.
        run: |
          cargo llvm-cov --no-report -p parapet --all-features --lib
          cargo llvm-cov report --summary-only | tee coverage.txt
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Publish summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo
            echo '```'
            cat coverage.txt || echo '(no summary produced)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce the coverage floor
        run: cargo llvm-cov report --fail-under-lines "${COVERAGE_FLOOR}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 7

  conformance-compile:
    name: CRS @rx compile coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch CRS ${{ env.CRS_VERSION }}
        run: |
          curl -sL "https://github.com/coreruleset/coreruleset/archive/refs/tags/v${CRS_VERSION}.tar.gz" \
            | tar xz
      - name: Extract @rx operands
        run: |
          python3 crates/parapet-conformance/tools/extract_rx.py \
            "coreruleset-${CRS_VERSION}/rules" rx.json
      - name: Every CRS pattern must compile
        run: cargo run -p parapet-conformance -- compile rx.json

  conformance-parse:
    name: CRS parse coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch CRS ${{ env.CRS_VERSION }}
        run: |
          curl -sL "https://github.com/coreruleset/coreruleset/archive/refs/tags/v${CRS_VERSION}.tar.gz" \
            | tar xz
      - name: Every CRS directive must parse, with the expected counts
        run: |
          cargo run -p parapet-conformance -- parse \
            "coreruleset-${CRS_VERSION}/rules" "crs-${CRS_VERSION}"

  conformance-operators:
    name: CRS operator compile coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch CRS ${{ env.CRS_VERSION }}
        run: |
          curl -sL "https://github.com/coreruleset/coreruleset/archive/refs/tags/v${CRS_VERSION}.tar.gz" \
            | tar xz
      - name: Every CRS operator must compile, or be a known refusal
        run: |
          cargo run -p parapet-conformance -- operators \
            "coreruleset-${CRS_VERSION}/rules"

  crs-regression-suite:
    name: CRS regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install --quiet pyyaml
      - name: Fetch CRS ${{ env.CRS_VERSION }}
        run: |
          curl -sL "https://github.com/coreruleset/coreruleset/archive/refs/tags/v${CRS_VERSION}.tar.gz" \
            | tar xz
      - name: Convert the FTW corpus
        run: |
          python3 crates/parapet-conformance/tools/ftw_to_json.py \
            "coreruleset-${CRS_VERSION}/tests/regression/tests" ftw.json
      - name: Run it, against a ratcheting baseline
        run: |
          cargo run -p parapet-conformance -- ftw \
            "coreruleset-${CRS_VERSION}/rules" ftw.json ${{ env.FTW_BASELINE }}

  end-to-end:
    name: CRS blocks attacks and allows benign traffic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch CRS ${{ env.CRS_VERSION }}
        run: |
          curl -sL "https://github.com/coreruleset/coreruleset/archive/refs/tags/v${CRS_VERSION}.tar.gz" \
            | tar xz
      - name: Run the request corpus through the full rule set
        run: |
          cargo run -p parapet-conformance -- run \
            "coreruleset-${CRS_VERSION}/rules"

  transform-diff:
    name: Transformations agree with the reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Generate the corpus
        run: |
          python3 crates/parapet-conformance/tools/gen_transform_corpus.py corpus.json
      - name: Compute reference outputs
        run: |
          git clone --depth 1 https://github.com/corazawaf/coraza.git /tmp/coraza-ref
          cp crates/parapet-conformance/tools/coraza_probe_test.go \
            /tmp/coraza-ref/internal/transformations/
          cd /tmp/coraza-ref
          PROBE_IN=$GITHUB_WORKSPACE/corpus.json \
          PROBE_OUT=$GITHUB_WORKSPACE/reference.json \
            go test ./internal/transformations/ -run TestParapetProbe -v
      - name: No unexpected divergence
        run: cargo run -p parapet-conformance -- transform-diff reference.json

  differential-re2:
    name: Repairs agree with Go/RE2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch CRS ${{ env.CRS_VERSION }}
        run: |
          curl -sL "https://github.com/coreruleset/coreruleset/archive/refs/tags/v${CRS_VERSION}.tar.gz" \
            | tar xz
      - name: Differential test
        run: |
          echo "Wired up with the corpus generator; see crates/parapet-conformance/README.md"
